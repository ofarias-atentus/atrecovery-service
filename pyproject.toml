[project]
name = "recovery-poc-three"
version = "0.1.0"
description = "FastAPI Template Management PoC (retrieve/maintain/categorize, execution out-of-scope)"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115",
  "uvicorn[standard]>=0.30",
  "sqlalchemy[asyncio]>=2.0",
  "aiosqlite>=0.20",
  "pydantic>=2.7",
  "pydantic-settings>=2.4",
  "email-validator>=2.0",
  "pyjwt>=2.8",
  "passlib[bcrypt]>=1.7.4",
  "python-multipart>=0.0.18",
  "sqladmin>=0.20",
  "itsdangerous>=2.0",
  "jinja2>=3.1",
  "httpx2>=2.0",
  "python-dotenv>=1.0",
  "jsonschema>=4.0",
  "croniter>=2.0",
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-asyncio>=0.23",
  "anyio>=4",
  "ruff>=0.5",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
# B008 (function call in arg defaults) is FastAPI's canonical Depends() idiom.
ignore = ["B008"]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"
